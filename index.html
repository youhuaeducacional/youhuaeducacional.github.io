<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>You Hua Educacional</title>
<style>
:root{--g:#1b7a3d;--g2:#2e9e57;--bg:#eef7f0;--c:#fff;--t:#16301e;--m:#5b7a65}
@media(prefers-color-scheme:dark){:root{--bg:#0f1d14;--c:#173222;--t:#e6f3ea;--m:#9bbba5}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--g);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:1.3rem;cursor:pointer}
.xp{min-width:200px}.bar{height:10px;background:#ffffff40;border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#ffe27a}
main{max-width:900px;margin:0 auto;padding:18px}
h2{color:var(--g2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--c);border-radius:12px;padding:14px;box-shadow:0 1px 4px #0002}
.les{cursor:pointer;border:2px solid transparent}.les:hover{border-color:var(--g2)}
.les b{display:block;color:var(--g2)}.les small{color:var(--m)}
button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:1rem;cursor:pointer}
button.o{background:var(--c);color:var(--t);border:2px solid var(--g2);width:100%;margin:6px 0;text-align:left}
button.ok{background:#2e9e57;color:#fff}button.bad{background:#c0392b;color:#fff}
button.s{background:transparent;color:var(--g2);border:2px solid var(--g2)}
.fc{text-align:center;padding:30px 16px}.hz{font-size:4.5rem;line-height:1.1}.py{font-size:1.5rem;color:var(--g2)}.pt{font-size:1.8rem;margin-top:18px;font-weight:600}.us{color:var(--m);margin-top:12px}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.lock{opacity:.6}
</style></head><body>
<header><h1 onclick="home()">🌿 You Hua Educacional</h1><div class="xp" id="xp"></div></header>
<main id="app"></main>

];
const A=D.map((d,i)=>d[2].split('\n').map(l=>{const[h,p,t]=l.split('|');let u='';
if(d[1]=='v')u=`Em ação: 在${h} · Passado: ${h}了 · Futuro: 要${h}`;
if(d[1]=='a')u=`很${h} = muito ${t.toLowerCase()} · 不${h} = não é ${t.toLowerCase()}`;
return{h,p,t,u,l:i}}));
const ALL=A.flat();
let S={best:{},inter:false};try{S=Object.assign(S,JSON.parse(localStorage.getItem('yh')))}catch(e){}
const save=()=>{try{localStorage.setItem('yh',JSON.stringify(S))}catch(e){}};
const xpT=()=>Object.values(S.best).reduce((a,b)=>a+b,0);
const lvl=()=>Math.floor(xpT()/10);
const app=document.getElementById('app');
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function hud(){const x=xpT();document.getElementById('xp').innerHTML=`<b>Level ${lvl()}</b> · ${x} XP<div class="bar"><i style="width:${(x%10)*10}%"></i></div>`}
function home(){hud();const L=lvl();
let h=`<h2>Classe Iniciante</h2><div class="grid">`+A.map((w,i)=>`<div class="card les" onclick="lesson(${i})"><b>Aula ${i+1}</b>${D[i][0]}<br><small>${S.best[i]!=null?'Melhor: '+S.best[i]+'/10':'Não feita'}</small></div>`).join('')+`</div><h2>Classe Intermediário</h2><div class="card ${S.inter?'':'lock'}">`;
if(S.inter)h+=`✅ Acesso liberado! O conteúdo do Intermediário estará disponível em breve.`;
else if(L>=13)h+=`Você chegou ao level 13! Faça a prova de 30 palavras (mínimo 21 acertos) para liberar.<br><br><button onclick="quiz(sh(ALL).slice(0,30),'t')">Fazer a prova de acesso</button>`;
else h+=`🔒 Requer level 13 (você está no ${L}) e a prova de 30 palavras.`;
app.innerHTML=h+`</div>`}
let cur=0,k=0;
function lesson(i){cur=i;k=0;card()}
function card(){const w=A[cur][k];
app.innerHTML=`<button class="s" onclick="home()">← Voltar</button><p>Aula ${cur+1} · ${D[cur][0]} · ${k+1}/10</p><div class="card fc"><div class="hz">${w.h}</div><div class="py">${w.p}</div><div class="pt">${w.t}</div><div class="us">${w.u}</div></div><div class="row"><button ${k?'':'disabled style="opacity:.4"'} onclick="k--;card()">← Anterior</button>${k<9?'<button onclick="k++;card()">Próxima →</button>':'<button onclick="quiz(sh(A[cur]),'+cur+')">Fazer a prova ✍️</button>'}</div>`}
function quiz(ws,mode){let q=0,sc=0;
function show(){if(q>=ws.length)return end();const w=ws[q],zh=Math.random()<.5;
const ds=sh(ALL.filter(x=>x.t!=w.t&&x.h!=w.h)).slice(0,3),op=sh([w,...ds]);
app.innerHTML=`<p>Questão ${q+1}/${ws.length}</p><div class="card fc"><div class="${zh?'hz':'pt'}">${zh?w.h:w.t}</div>${zh?`<div class="py">${w.p}</div>`:''}</div><p>${zh?'Qual é o significado em português?':'Qual é a palavra em chinês?'}</p><div id="o">`+op.map((o,j)=>`<button class="o" data-j="${j}">${zh?o.t:o.h+' <small>('+o.p+')</small>'}</button>`).join('')+`</div>`;
document.querySelectorAll('#o button').forEach((b,j)=>b.onclick=()=>{const r=op[j]==w;if(r)sc++;b.className='o '+(r?'ok':'bad');document.querySelectorAll('#o button').forEach((c,m)=>{c.onclick=null;if(op[m]==w)c.className='o ok'});q++;setTimeout(show,1000)})}
function end(){let m='';
if(mode=='t'){const p=sc>=21;if(p){S.inter=true;save()}m=p?'🎉 Aprovado! Classe Intermediário liberada.':'Você precisa de 21 acertos. Tente novamente!'}
else{const g=Math.max(0,sc-(S.best[mode]||0)),l0=lvl();S.best[mode]=Math.max(sc,S.best[mode]||0);save();m=`+${g} XP${g<sc?' (só melhora sobre sua melhor nota conta)':''}`+(lvl()>l0?`<br>⬆️ Subiu para o level ${lvl()}!`:'')}
app.innerHTML=`<div class="card fc"><div class="hz">${sc}/${ws.length}</div><p>${m}</p><button onclick="home()">Início</button></div>`;hud()}
show()}
home();
</script></body></html>
