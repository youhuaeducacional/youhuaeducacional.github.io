<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#0b8a3e;--brand2:#086b30;--bg:#f7f9f7;--c:#fff;--t:#24332a;--m:#6b7c71;--line:#e5e8e5;--gray:#e5e5e5;--gray2:#c9c9c9;
--ok:#58cc02;--ok2:#46a302;--okbg:#d7ffb8;--bad:#ff4b4b;--bad2:#d33131;--badbg:#ffdfe0;--blue:#1cb0f6;--blue2:#1899d6}
@media(prefers-color-scheme:dark){:root{--bg:#131f18;--c:#1c2b22;--t:#e8f2ec;--m:#9db3a5;--line:#2c3d33;--gray:#33443a;--gray2:#26352c;--okbg:#20381a;--badbg:#3d1f20}}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;font-weight:700;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:10px 16px;box-shadow:0 2px 0 var(--brand2)}
.hd{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid #fff}
.brand h1{margin:0;font-size:1.35rem;font-weight:900;letter-spacing:.2px;line-height:1}
.brand small{display:block;font-size:.75rem;font-weight:700;opacity:.85;margin-top:3px}
.stats{display:flex;gap:14px;font-size:1rem}
.stats span{display:flex;align-items:center;gap:4px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:18px 16px 120px}
.card{background:var(--c);border:2px solid var(--line);border-radius:18px;padding:18px}
/* Botões estilo "3D" */
.btn{font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.6px;border:0;border-radius:14px;padding:13px 22px;font-size:.95rem;cursor:pointer;
background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok2);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ok2)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue2)}
.btn.ghost{background:var(--c);color:var(--m);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.red{background:var(--bad);box-shadow:0 4px 0 var(--bad2)}
.btn:disabled{opacity:.4;cursor:default}
/* Página inicial */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.hero .txt{flex:1 1 260px}
.hero h2{margin:0 0 4px;font-size:1.6rem;font-weight:900}
.hero p{margin:0 0 12px;color:var(--m)}
.hero .mascot{width:110px;height:110px;flex:0 0 auto}
.prog{height:16px;background:var(--gray);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;box-shadow:inset 0 -4px 0 #0001}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:22px}
.how div{background:var(--c);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;font-size:.92rem}
.how img{width:38px;height:38px}
.unit{border-radius:16px;color:#fff;padding:14px 18px;margin:28px 0 8px;box-shadow:0 4px 0 #0002}
.unit b{display:block;font-size:.8rem;opacity:.9;text-transform:uppercase;letter-spacing:.8px}
.unit span{font-size:1.25rem;font-weight:900}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;--zz:1}
html,body{overflow-x:hidden}
@media(max-width:480px){.path{--zz:.55}.node{width:130px}.stats{gap:10px;font-size:.9rem}.brand h1{font-size:1.15rem}}
.node{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(calc(var(--o)*var(--zz)*1px));cursor:pointer;text-align:center;width:150px}
.node .dot{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--uc);box-shadow:0 7px 0 var(--ud);transition:transform .08s}
.node:active .dot{transform:translateY(5px);box-shadow:0 2px 0 var(--ud)}
.node .dot img{width:44px;height:44px}
.node.new .dot{background:var(--gray);box-shadow:0 7px 0 var(--gray2)}
.node.new .dot img{filter:grayscale(.6);opacity:.75}
.node.next .dot{outline:5px solid var(--uc);outline-offset:5px}
.node .lb{margin-top:12px;font-size:.88rem;line-height:1.15}
.node .lb small{display:block;color:var(--m);font-weight:700;font-size:.78rem;margin-top:2px}
.stars{color:#ffc800;letter-spacing:1px;font-size:.9rem}
.bubble{position:absolute;top:-44px;background:var(--c);color:var(--uc);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:900;font-size:.85rem;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;text-transform:uppercase}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line);border-bottom:0}
@keyframes bob{50%{transform:translateY(-6px)}}
.lock{opacity:.75}
/* Aula */
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.x{background:none;border:0;font-size:1.6rem;color:var(--m);cursor:pointer;padding:4px 8px;font-family:inherit}
.top .prog{flex:1;margin:0}
.top span{color:var(--m);font-size:.9rem}
.flash{text-align:center;padding:22px 18px}
.pic{width:min(220px,62vw);aspect-ratio:1;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;border:3px solid #0000000d}
.pic img{width:68%;height:68%}
.emo{font-size:5rem;line-height:1}
.pic .emo{font-size:7rem}
.wrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0}
.hz{font-size:3.6rem;line-height:1.1;font-weight:700}
.py{font-size:1.35rem;color:var(--brand);font-weight:800}
.pt{font-size:1.6rem;font-weight:900}
.us{color:var(--m);margin-top:14px;font-size:.95rem}
.snd{flex:0 0 auto;width:48px;height:48px;border-radius:14px;border:0;cursor:pointer;background:var(--blue);box-shadow:0 4px 0 var(--blue2);display:grid;place-items:center;padding:0}
.snd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue2)}
.snd.sm{width:38px;height:38px;border-radius:12px}
.snd svg{width:58%;height:58%;fill:#fff}
.tag{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:var(--m);margin-bottom:2px}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
/* Prova */
.q{font-size:1.4rem;font-weight:900;margin:0 0 14px}
.qbox{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.qbox .pic{width:110px;margin:0;border-radius:18px}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.o{font:inherit;font-weight:800;background:var(--c);color:var(--t);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px;cursor:pointer;text-align:left;font-size:1.05rem}
.o:hover{background:var(--bg)}
.o small{color:var(--m);font-weight:700}
.o .ohz{font-size:1.5rem;margin-right:6px}
.o.pc{text-align:center;padding:12px 8px}
.o.pc img{width:64px;height:64px;display:block;margin:0 auto 8px}
.o.pc .emo{font-size:3.4rem;display:block;margin-bottom:8px}
.o.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok2)}
.o.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad2)}
.fb{position:fixed;left:0;right:0;bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:9;animation:up .2s ease-out}
.fb .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--okbg);color:var(--ok2)}.fb.bad{background:var(--badbg);color:var(--bad2)}
.fb h3{margin:0;font-size:1.35rem;font-weight:900}
.fb p{margin:2px 0 0}
@keyframes up{from{transform:translateY(100%)}}
.end{text-align:center;padding:30px 18px}
.end .big{font-size:3.4rem;font-weight:900;margin:6px 0}
.end .stars{font-size:2.2rem}
footer{text-align:center;color:var(--m);font-size:.85rem;margin-top:40px}

西红柿|xīhóngshì|Tomate|🍅
土豆|tǔdòu|Batata|🥔
青菜|qīngcài|Verdura|🥬
洋葱|yángcōng|Cebola|🧅
玉米|yùmǐ|Milho|🌽`,"🍎"],
["Posições e direções","",`上|shàng|Em cima|⬆️
下|xià|Embaixo|⬇️
左|zuǒ|Esquerda|⬅️
右|yòu|Direita|➡️
前|qián|Frente|⏩
后|hòu|Atrás|⏪
里|lǐ|Dentro|📥
外|wài|Fora|📤
这|zhè|Isto|👇
那|nà|Aquilo|👉`,"🧭"],
["Adjetivos 3","a",`长|cháng|Comprido|📏
短|duǎn|Curto|✂️
高|gāo|Alto|🦒
矮|ǎi|Baixo|🐜
多|duō|Muito|➕
少|shǎo|Pouco|➖
远|yuǎn|Longe|🔭
近|jìn|Perto|🧲
容易|róngyì|Fácil|😎
难|nán|Difícil|🧗`,"📐"],
["Frases úteis","",`我爱你|wǒ ài nǐ|Eu te amo|🥰
没问题|méi wèntí|Sem problema|👌
我不懂|wǒ bù dǒng|Não entendo|😕
请再说一次|qǐng zài shuō yí cì|Repita, por favor|🔁
多少钱|duōshao qián|Quanto custa|💲
很好|hěn hǎo|Muito bom|🌟
我是巴西人|wǒ shì Bāxīrén|Sou brasileiro|🇧🇷
欢迎|huānyíng|Bem-vindo|🎉
祝你好运|zhù nǐ hǎoyùn|Boa sorte|🍀
没关系|méi guānxi|Não tem problema|😌`,"💬"]
];
// Unidades (5 aulas cada): nome, cor, cor escura, fundo pastel dos desenhos
const U=[["Primeiros passos","#58cc02","#46a302","#e9fbd9"],["Dia a dia","#1cb0f6","#1899d6","#ddf4ff"],["Pelo mundo","#ce82ff","#a568cc","#f5e6ff"],["Conversando","#ff9600","#cc7800","#fff0d9"],["Ampliando o vocabulário","#ff4b4b","#d33131","#ffe3e3"]];
const unitOf=i=>U[Math.floor(i/5)];
const A=D.map((d,i)=>d[2].split('\n').map(l=>{const[h,p,t,e]=l.split('|');let u='';
if(d[1]=='v')u=`Em ação: 在${h} · Passado: ${h}了 · Futuro: 要${h}`;
if(d[1]=='a')u=`很${h} = muito ${t.toLowerCase()} · 不${h} = não é ${t.toLowerCase()}`;
return{h,p,t,e,u,l:i}}));
const ALL=A.flat();

// ---------- Desenhos (Twemoji, com o emoji do aparelho como reserva) ----------
const TW='https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/';
function tw(e){const c=[...e].map(x=>x.codePointAt(0).toString(16));return TW+(e.includes('\u200d')?c:c.filter(x=>x!='fe0f')).join('-')+'.svg'}
const img=e=>`<img src="${tw(e)}" alt="" draggable="false" onerror="this.outerHTML='<span class=emo>${e}</span>'">`;

// ---------- Áudio (voz do navegador) ----------
let V=[];const lv=()=>{V=speechSynthesis.getVoices()};
if('speechSynthesis'in window){lv();speechSynthesis.onvoiceschanged=lv}
function say(text,lang){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);u.lang=lang;
const n=s=>s.lang.replace('_','-').toLowerCase();
const v=V.find(s=>n(s)==lang.toLowerCase())||V.find(s=>n(s).startsWith(lang.slice(0,2)));
if(v)u.voice=v;u.rate=lang.startsWith('zh')?.75:.95;speechSynthesis.speak(u)}
const ptTxt=t=>t.replace(/\(.*?\)/g,'').replace('/',',').trim();
const sayZh=w=>say(w.h,'zh-CN'),sayPt=w=>say(ptTxt(w.t),'pt-BR');
const SPK='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

// ---------- Progresso ----------
let S={best:{},inter:false,streak:0,last:''};try{S=Object.assign(S,JSON.parse(localStorage.getItem('yh')))}catch(e){}
const save=()=>{try{localStorage.setItem('yh',JSON.stringify(S))}catch(e){}};
const xpT=()=>Object.values(S.best).reduce((a,b)=>a+b,0);
const lvl=()=>Math.floor(xpT()/10);
const day=o=>{const d=new Date();d.setDate(d.getDate()-(o||0));return d.toDateString()};
const streak=()=>S.last==day()||S.last==day(1)?S.streak:0;
const starsOf=s=>s==null?0:s>=10?3:s>=8?2:s>=6?1:0;
const done=i=>starsOf(S.best[i])>0;
const nextL=()=>{const i=D.findIndex((_,j)=>!done(j));return i<0?0:i};
const app=document.getElementById('app');
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function hud(){document.getElementById('stats').innerHTML=`<span title="Dias seguidos">🔥 ${streak()}</span><span title="XP total">⭐ ${xpT()}</span><span title="Level">🏅 ${lvl()}</span>`}

// ---------- Página inicial ----------
const ZZ=[0,70,100,70,0,-70,-100,-70];
function home(){hud();window.speechSynthesis&&speechSynthesis.cancel();scrollTo(0,0);
const n=nextL(),nd=D.filter((_,i)=>done(i)).length,L=lvl(),first=xpT()==0;
let h=`<div class="card hero"><img class="mascot" src="${tw('🐼')}" alt=""><div class="txt">
<h2>${first?'你好! Bem-vindo!':'加油! Continue assim!'}</h2>
<p>${first?'Aprenda chinês com desenhos, áudio e provinhas rápidas.':'Você já concluiu '+nd+' de '+D.length+' aulas.'}</p>
<div class="prog"><i style="width:${nd/D.length*100}%"></i></div>
<button class="btn" onclick="lesson(${n})">${first?'Começar a aula 1':'Continuar · Aula '+(n+1)}</button></div></div>`;
if(first)h+=`<div class="how"><div>${img('🃏')}<span>1. Veja os cartões com desenhos</span></div><div>${img('🔊')}<span>2. Ouça a pronúncia em chinês e português</span></div><div>${img('✍️')}<span>3. Faça a prova e ganhe XP</span></div></div>`;
U.forEach((u,ui)=>{h+=`<div class="unit" style="background:${u[1]}"><b>Unidade ${ui+1}</b><span>${u[0]}</span></div><div class="path">`;
for(let i=ui*5;i<ui*5+5&&i<D.length;i++){const st=starsOf(S.best[i]),cls=S.best[i]==null&&i!=n?'new':'';
h+=`<div class="node ${cls} ${i==n?'next':''}" style="--o:${ZZ[i%8]};--uc:${u[1]};--ud:${u[2]}" onclick="lesson(${i})">${i==n?`<div class="bubble">${first?'Começar':'Próxima'}</div>`:''}
<div class="dot">${img(D[i][3])}</div><div class="lb">Aula ${i+1} · ${D[i][0]}<small>${S.best[i]!=null?`<span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span> ${S.best[i]}/10`:'Não feita'}</small></div></div>`}
h+=`</div>`});
h+=`<div class="unit" style="background:#777"><b>Próximo nível</b><span>Classe Intermediário</span></div><div class="card ${S.inter?'':'lock'}">`;
if(S.inter)h+=`✅ Acesso liberado! O conteúdo do Intermediário estará disponível em breve.`;
else if(L>=13)h+=`Você chegou ao level 13! Faça a prova de 30 palavras (mínimo 21 acertos) para liberar.<br><br><button class="btn" onclick="quiz(sh(ALL).slice(0,30),'t')">Fazer a prova de acesso</button>`;
else h+=`🔒 Requer level 13 (você está no ${L}) e a prova de 30 palavras (mínimo 21 acertos).`;
app.innerHTML=h+`</div><footer>Youhua Educacional · 幼华双语学校 · desde 1992</footer>`}

// ---------- Aula (cartões) ----------
let cur=0,k=0;
function lesson(i){cur=i;k=0;card()}
function card(){const w=A[cur][k],u=unitOf(cur);scrollTo(0,0);
app.innerHTML=`<div class="top"><button class="x" onclick="home()" title="Sair">✕</button><div class="prog"><i style="width:${(k+1)*10}%;background:${u[1]}"></i></div><span>${k+1}/10</span></div>
<p class="tag">Aula ${cur+1} · ${D[cur][0]}</p>
<div class="card flash"><div class="pic" style="background:${u[3]}">${img(w.e)}</div>
<div class="wrow"><button class="snd" onclick="sayZh(A[cur][k])" title="Ouvir em chinês">${SPK}</button><div><div class="hz">${w.h}</div><div class="py">${w.p}</div></div></div>
<div class="wrow"><button class="snd sm" onclick="sayPt(A[cur][k])" title="Ouvir em português">${SPK}</button><div class="pt">${w.t}</div></div>
${w.u?`<div class="us">${w.u}</div>`:''}</div>
<div class="row"><button class="btn ghost" ${k?'':'disabled'} onclick="k--;card()">← Anterior</button>${k<9?'<button class="btn" onclick="k++;card()">Próxima →</button>':'<button class="btn" onclick="quiz(sh(A[cur]),cur)">Fazer a prova ✍️</button>'}</div>`;
sayZh(w)}

// ---------- Prova ----------
function quiz(ws,mode){let q=0,sc=0;
function show(){scrollTo(0,0);if(q>=ws.length)return end();const w=ws[q],zh=Math.random()<.5,u=unitOf(w.l);
const ds=sh(ALL.filter(x=>x.t!=w.t&&x.h!=w.h&&x.e!=w.e)).slice(0,3),op=sh([w,...ds]);
let h=`<div class="top"><button class="x" onclick="home()" title="Sair">✕</button><div class="prog"><i style="width:${q/ws.length*100}%"></i></div><span>${q+1}/${ws.length}</span></div>`;
if(zh)h+=`<p class="q">O que significa?</p><div class="qbox"><button class="snd" id="qs" title="Ouvir">${SPK}</button><div><div class="hz">${w.h}</div><div class="py">${w.p}</div></div></div>
<div class="opts g2" id="o">`+op.map(o=>`<button class="o pc">${img(o.e)}${o.t}</button>`).join('');
else h+=`<p class="q">Como se diz em chinês?</p><div class="qbox"><div class="pic" style="background:${u[3]}">${img(w.e)}</div><div class="wrow"><button class="snd sm" id="qs" title="Ouvir">${SPK}</button><div class="pt">${w.t}</div></div></div>
<div class="opts" id="o">`+op.map(o=>`<button class="o"><span class="ohz">${o.h}</span> <small>${o.p}</small></button>`).join('');
app.innerHTML=h+`</div><div id="fb"></div>`;
const sp=()=>zh?sayZh(w):sayPt(w);document.getElementById('qs').onclick=sp;sp();
const bs=[...document.querySelectorAll('#o button')];
bs.forEach((b,j)=>b.onclick=()=>{const r=op[j]==w;if(r)sc++;
bs.forEach((c,m)=>{c.onclick=null;if(op[m]==w)c.classList.add('ok')});if(!r)b.classList.add('bad');
sayZh(w);
document.getElementById('fb').innerHTML=`<div class="fb ${r?'ok':'bad'}"><div class="in"><div><h3>${r?'Muito bem! 太棒了!':'Resposta correta:'}</h3><p>${w.h} (${w.p}) = ${w.t}</p></div><button class="btn ${r?'':'red'}" id="nx">Continuar</button></div></div>`;
const nx=document.getElementById('nx');nx.focus();nx.onclick=()=>{q++;show()}})}
function end(){let m='',ok=true;scrollTo(0,0);
if(mode=='t'){ok=sc>=21;if(ok){S.inter=true;save()}m=ok?'🎉 Aprovado! Classe Intermediário liberada.':'Você precisa de 21 acertos. Tente novamente!'}
else{const g=Math.max(0,sc-(S.best[mode]||0)),l0=lvl();S.best[mode]=Math.max(sc,S.best[mode]||0);
if(S.last!=day()){S.streak=S.last==day(1)?S.streak+1:1;S.last=day()}save();
m=`+${g} XP${g<sc?' (só melhora sobre sua melhor nota conta)':''}`+(lvl()>l0?`<br>⬆️ Subiu para o level ${lvl()}!`:'');ok=sc>=6}
const st=mode=='t'?0:starsOf(sc);
app.innerHTML=`<div class="card end"><img src="${tw(ok?'🏆':'💪')}" alt="" style="width:110px"><div class="big">${sc}/${ws.length}</div>
${mode!='t'?`<div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>`:''}<p>${m}</p>
<div class="row" style="justify-content:center;flex-wrap:wrap">${mode!='t'?`<button class="btn ghost" onclick="lesson(${mode})">Revisar aula</button>`:''}
${mode!='t'&&mode<D.length-1?`<button class="btn" onclick="lesson(${mode+1})">Próxima aula →</button>`:''}<button class="btn blue" onclick="home()">Início</button></div></div>`;hud()}
show()}
home();
</script></body></html>
