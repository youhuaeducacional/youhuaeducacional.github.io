<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#0b8a3e;--brand2:#086b30;--bg:#f7f9f7;--c:#fff;--t:#24332a;--m:#6b7c71;--line:#e5e8e5;--gray:#e5e5e5;--gray2:#c9c9c9;
--ok:#58cc02;--ok2:#46a302;--okbg:#d7ffb8;--midbg:#fff3d1;--bad:#ff4b4b;--bad2:#d33131;--badbg:#ffdfe0;--blue:#1cb0f6;--blue2:#1899d6}
@media(prefers-color-scheme:dark){:root{--bg:#131f18;--c:#1c2b22;--t:#e8f2ec;--m:#9db3a5;--line:#2c3d33;--gray:#33443a;--gray2:#26352c;--okbg:#20381a;--badbg:#3d1f20;--midbg:#3a3214}}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;font-weight:700;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:10px 16px;box-shadow:0 2px 0 var(--brand2)}
.hd{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid #fff}
.brand h1{margin:0;font-size:1.35rem;font-weight:900;letter-spacing:.2px;line-height:1}
.brand small{display:block;font-size:.75rem;font-weight:700;opacity:.85;margin-top:3px}
.stats{display:flex;gap:14px;font-size:1rem}
.stats span{display:flex;align-items:center;gap:4px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:18px 16px 120px}
.card{background:var(--c);border:2px solid var(--line);border-radius:18px;padding:18px}
/* Botões estilo "3D" */
.btn{font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.6px;border:0;border-radius:14px;padding:13px 22px;font-size:.95rem;cursor:pointer;
background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok2);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ok2)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue2)}
.btn.ghost{background:var(--c);color:var(--m);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.red{background:var(--bad);box-shadow:0 4px 0 var(--bad2)}
.btn:disabled{opacity:.4;cursor:default}
/* Página inicial */
.hero{margin-bottom:18px;padding:0;overflow:hidden}
.hero .txt{padding:16px 20px 20px}
.hero .banner{display:block;width:100%;aspect-ratio:16/7;object-fit:cover;object-position:40% 55%}
.hero h2{margin:0 0 4px;font-size:1.6rem;font-weight:900}
.hero p{margin:0 0 12px;color:var(--m)}
.prog{height:16px;background:var(--gray);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;box-shadow:inset 0 -4px 0 #0001}
.hsk{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;border-color:#f5d27a}
.hsk img,.hsk .emo{width:46px;height:46px;font-size:2.4rem;flex:0 0 auto}
.hsk b{font-size:1.05rem;font-weight:900}
.hsk p{margin:6px 0 0;color:var(--m);font-size:.95rem}
.hsk p.zh{font-weight:600}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:22px}
.how div{background:var(--c);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;font-size:.92rem}
.how img{width:38px;height:38px}
.unit{border-radius:16px;color:#fff;padding:14px 18px;margin:28px 0 8px;box-shadow:0 4px 0 #0002}
.unit b{display:block;font-size:.8rem;opacity:.9;text-transform:uppercase;letter-spacing:.8px}
.unit span{font-size:1.25rem;font-weight:900}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;--zz:1}
html,body{overflow-x:hidden}
@media(max-width:480px){.path{--zz:.55}.node{width:130px}.stats{gap:10px;font-size:.9rem}.brand h1{font-size:1.15rem}}
.node{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(calc(var(--o)*var(--zz)*1px));cursor:pointer;text-align:center;width:150px}
.node .dot{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--uc);box-shadow:0 7px 0 var(--ud);transition:transform .08s}
.node:active .dot{transform:translateY(5px);box-shadow:0 2px 0 var(--ud)}
.node .dot img{width:44px;height:44px}
.node.new .dot{background:var(--gray);box-shadow:0 7px 0 var(--gray2)}
.node.new .dot img{filter:grayscale(.6);opacity:.75}
.node.next .dot{outline:5px solid var(--uc);outline-offset:5px}
.node .lb{margin-top:12px;font-size:.88rem;line-height:1.15}
.node .lb small{display:block;color:var(--m);font-weight:700;font-size:.78rem;margin-top:2px}
.stars{color:#ffc800;letter-spacing:1px;font-size:.9rem}
.bubble{position:absolute;top:-44px;background:var(--c);color:var(--uc);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:900;font-size:.85rem;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;text-transform:uppercase}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line);border-bottom:0}
@keyframes bob{50%{transform:translateY(-6px)}}
.lock{opacity:.75}
/* Aula */
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.x{background:none;border:0;font-size:1.6rem;color:var(--m);cursor:pointer;padding:4px 8px;font-family:inherit}
.top .prog{flex:1;margin:0}
.top span{color:var(--m);font-size:.9rem}
.flash{text-align:center;padding:22px 18px}
.pic{width:min(220px,62vw);aspect-ratio:1;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;border:3px solid #0000000d}
.pic img{width:68%;height:68%}
.emo{font-size:5rem;line-height:1}
.pic .emo{font-size:7rem}
.wrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0}
.hz{font-size:3.6rem;line-height:1.1;font-weight:700}
.py{font-size:1.35rem;color:var(--brand);font-weight:800}
.pt{font-size:1.6rem;font-weight:900}
.us{color:var(--m);margin-top:14px;font-size:.95rem}
.snd{flex:0 0 auto;width:48px;height:48px;border-radius:14px;border:0;cursor:pointer;background:var(--blue);box-shadow:0 4px 0 var(--blue2);display:grid;place-items:center;padding:0}
.snd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue2)}
.snd.sm{width:38px;height:38px;border-radius:12px}
.snd svg{width:58%;height:58%;fill:#fff}
.tag{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:var(--m);margin-bottom:2px}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
/* Prova */
.q{font-size:1.4rem;font-weight:900;margin:0 0 14px}
.qbox{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.qbox .pic{width:110px;margin:0;border-radius:18px}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.o{font:inherit;font-weight:800;background:var(--c);color:var(--t);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px;cursor:pointer;text-align:left;font-size:1.05rem}
.o:hover{background:var(--bg)}
.o small{color:var(--m);font-weight:700}
.o .ohz{font-size:1.5rem;margin-right:6px}
.o.pc{text-align:center;padding:12px 8px}
.o.pc img{width:64px;height:64px;display:block;margin:0 auto 8px}
.o.pc .emo{font-size:3.4rem;display:block;margin-bottom:8px}
.o.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok2)}
.o.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad2)}
.fb{position:fixed;left:0;right:0;bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:9;animation:up .2s ease-out}
.fb .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--okbg);color:var(--ok2)}.fb.bad{background:var(--badbg);color:var(--bad2)}
.fb h3{margin:0;font-size:1.35rem;font-weight:900}
.fb p{margin:2px 0 0}
@keyframes up{from{transform:translateY(100%)}}
.end{text-align:center;padding:30px 18px}
.end .big{font-size:3.4rem;font-weight:900;margin:6px 0}
.end .stars{font-size:2.2rem}
/* Abas Iniciante / Intermediário */
.tabs{display:flex;gap:10px;margin-bottom:16px}
.tab{flex:1;font:inherit;font-weight:900;font-size:1rem;padding:12px 8px;border-radius:14px;border:2px solid var(--line);background:var(--c);color:var(--m);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tab small{font-weight:700;opacity:.8}
.tab.on{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.1);box-shadow:0 3px 0 var(--blue2)}
.lnk{font:inherit;font-weight:800;background:none;border:0;color:var(--blue);padding:0;margin-top:8px;cursor:pointer;text-decoration:underline}
/* Frases do Intermediário */
.hl em{color:#e8412c;font-style:normal}
.sent{text-align:left}
.hzs{font-size:2rem;line-height:1.3;font-weight:700}
.pts{font-size:1.3rem;font-weight:900;text-align:left}
.pic.sm{width:min(150px,45vw)}
.formal{margin-top:16px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;display:inline-block;text-align:left}
.badge{display:inline-block;font-size:.75rem;font-weight:800;background:#ffe9a8;color:#7a5a00;border-radius:99px;padding:2px 10px;margin-bottom:6px}
.intro h2{margin:0 0 6px;font-weight:900}
.intro .ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.intro .ex div{background:var(--bg);border-radius:12px;padding:8px 10px;text-align:center}
.intro .ex b{display:block;font-size:1.2rem;color:#e8412c}
.intro hr{border:0;border-top:2px solid var(--line);margin:16px 0}
.ans{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px;margin-bottom:16px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.tile{font:inherit;font-weight:800;font-size:1.05rem;background:var(--c);color:var(--t);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;cursor:pointer}
.tile.used{visibility:hidden}
.tile.zh{font-size:1.35rem}
/* Botão "Baixar app" e janelinha de instruções */
.dl{font:inherit;font-weight:800;font-size:.8rem;background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:99px;padding:5px 12px;cursor:pointer;margin-right:auto;white-space:nowrap}
.dl:hover{background:rgba(255,255,255,.28)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal .card{max-width:420px;width:100%;text-align:center}
.modal h3{margin:8px 0;font-weight:900}
.modal p{text-align:left;line-height:1.6}
.modal .card>img,.modal .card>.emo{width:56px;height:56px;font-size:3rem}
.code{font-size:2rem;font-weight:900;letter-spacing:6px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px;margin:8px 0;font-family:ui-monospace,Consolas,monospace}
.code.sm{font-size:1rem;letter-spacing:3px;padding:2px 8px;border-radius:8px;display:inline-block;margin:0}
/* "O que você quer aprender?" */
.learn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--m);margin:-4px 0 14px}
.learn b{color:var(--t)}.learn .lnk{margin:0}
.learnpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}
.lp{font:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--c);color:var(--t);cursor:pointer}
.lp:hover,.lp.on{border-color:var(--blue);background:rgba(28,176,246,.08)}
.lp img{width:54px!important;height:54px!important}.lp b{font-size:1.2rem;font-weight:900}.lp small{color:var(--m);font-weight:700;line-height:1.45}
html.tech .lp{border:1px solid var(--line)}html.tech .lp:hover,html.tech .lp.on{border-color:#5eead4;background:rgba(94,234,212,.08)}
/* Exercícios novos: ouvir, ligar pares, escrever */
.listen{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 22px;color:var(--m)}
.snd.big{width:100px;height:100px;border-radius:30px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.match>div{display:flex;flex-direction:column;gap:10px}
.mt{font:inherit;font-weight:800;font-size:1rem;background:var(--c);color:var(--t);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 8px;cursor:pointer;min-height:58px}
.mt.zh{font-size:1.5rem;line-height:1.15}
.mt.zh small{display:block;font-size:.8rem;font-weight:700;color:var(--brand);margin-top:2px}
.mt.ok small{color:inherit}
.mt.sel{border-color:var(--blue);background:rgba(28,176,246,.12)}
.mt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok2);opacity:.55;cursor:default}
.mt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tf{display:flex;flex-direction:column;align-items:center;gap:12px;margin:6px 0 22px}
.wl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 12px}
.wl span{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:.9rem}
.rev{border-color:#b7e3fa}
html.tech .mt{border:1px solid var(--line)}html.tech .rev{border-color:rgba(56,189,248,.35)}
/* Alternativas com botão de ouvir */
.orow{display:flex;gap:8px;align-items:center}
.orow .o{flex:1;min-width:0}
/* Aviso "está com dúvida?" */
.idle{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#ddf4ff;color:#1a5a7a;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 0 #b7e3fa;animation:up .25s ease-out}
.idle .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.idle .in>img,.idle .in>.emo{width:46px;height:46px;font-size:2.4rem;flex:0 0 auto}
.idle .tx{flex:1 1 200px;display:flex;flex-direction:column}
.idle .tx b{font-size:1.1rem;font-weight:900}
.idle .btn{padding:10px 16px;font-size:.85rem}
@media(prefers-color-scheme:dark){.idle{background:#16384a;color:#cdeeff;box-shadow:0 -2px 0 #1d4d66}}
/* Medalhas (imagens) — tamanho pela altura, a largura acompanha */
.mdl{height:1.5em;width:auto;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.stats .medal .mdl{height:28px;width:auto}
.tier>.mdl{height:78px;width:auto;flex:0 0 auto}
.tiers .mdl{height:24px;width:auto}
.rrow>.mdl{height:40px;width:auto}
.end .mdl{height:36px}
.mdl-e{font-size:1.2em;line-height:1;vertical-align:middle}.tier>.mdl-e{font-size:3.4rem}.rrow>.mdl-e{font-size:1.8rem}
/* Nome e ranking */
@media(max-width:560px){.tabs{flex-wrap:wrap}.tab{flex:1 1 40%}}
.inp{font:inherit;font-weight:800;font-size:1.2rem;width:100%;max-width:360px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--t);text-align:center;margin:6px 0}
.inp:focus{outline:none;border-color:var(--blue)}
.err{color:var(--bad)}
.rrow{display:flex;align-items:center;gap:12px;background:var(--c);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.rrow.me{border-color:var(--blue);background:rgba(28,176,246,.08)}
.rrow>img,.rrow>.emo{width:30px;height:30px;font-size:1.6rem;flex:0 0 auto}
.rrow .pos{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--bg);color:var(--m);flex:0 0 auto}
.rrow .pos.p1{background:#ffc800;color:#fff}.rrow .pos.p2{background:#b8c2cc;color:#fff}.rrow .pos.p3{background:#cd7f32;color:#fff}
.rrow .nm{flex:1;min-width:0;font-weight:900;overflow-wrap:anywhere}
.rrow .nm em{font-style:normal;color:var(--blue);font-weight:800}
.rrow .nm small{display:block;color:var(--m);font-weight:700;font-size:.78rem}
.rrow .xp{font-weight:900;font-size:1.2rem;text-align:right}
.rrow .xp small{display:block;font-size:.7rem;color:var(--m)}
/* Medalhas */
.stats .medal img,.stats .medal .emo{width:20px;height:20px;font-size:1.1rem}
.stats .medal small{font-weight:700;opacity:.85;font-size:.75rem}
.tier{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.tier>img,.tier>.emo{width:56px;height:56px;font-size:3rem;flex:0 0 auto}
.tier .tx{flex:1;min-width:0}
.tier b{font-size:1.1rem;font-weight:900}
.tier small{color:var(--m)}
.tier .prog{margin:8px 0 6px}
.tiers{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tiers>span{display:flex;align-items:center;gap:4px;font-size:.8rem;padding:3px 10px 3px 4px;border-radius:99px;background:var(--bg);color:var(--m);filter:grayscale(1);opacity:.6}
.tiers>span.got{filter:none;opacity:1;color:var(--t)}
.tiers img,.tiers .emo{width:20px;height:20px;font-size:1rem}
/* Aula 0: tons e acentos */
.lcard.guide{width:100%;margin-bottom:18px;border-color:#f5d27a;background:var(--midbg)}
.gd{margin-bottom:16px}.gd h2{margin:0 0 8px;font-weight:900;font-size:1.3rem}.gd h3{margin:18px 0 8px;font-weight:900}
.trow{display:grid;grid-template-columns:64px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:2px solid var(--line)}
.trow small{color:var(--m)}
.pitch{width:64px;height:46px}.pitch line{stroke:var(--line);stroke-width:1}.pitch polyline{fill:none;stroke:var(--bad);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.pitch circle{fill:var(--bad)}
.mk2{font-size:1.3rem;color:var(--bad);font-weight:900}
.ex{text-align:center}.hz2{display:block;font-size:1.6rem;font-weight:700}
.rule{font-weight:900;font-size:1.1rem;text-align:center;color:var(--blue)}.rule.big{font-size:2rem;color:var(--bad)}
.trow:has(.exs){grid-template-columns:64px 1fr}
.exs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.ex2{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 10px 6px 6px}
.pair{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:520px){.trow{grid-template-columns:56px 1fr}.trow .ex,.trow>.snd{grid-column:auto}}
/* Treino de fala */
.seg{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.seg .tab{min-width:140px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.lcard{font:inherit;font-weight:800;text-align:left;display:flex;gap:10px;align-items:center;background:var(--c);color:var(--t);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px;cursor:pointer;font-size:.9rem}
.lcard:hover{background:var(--bg)}
.lcard img,.lcard .emo{width:34px;height:34px;font-size:1.8rem;flex:0 0 auto}
.lcard small{display:block;color:var(--m);font-weight:700}
.btn.mic{background:var(--bad);box-shadow:0 4px 0 var(--bad2)}
.btn.mic.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.fres{display:flex;gap:14px;align-items:center;text-align:left;margin-top:16px;border-radius:14px;padding:12px 14px;background:var(--bg)}
.fres.ok{background:var(--okbg)}.fres.mid{background:var(--midbg)}.fres.bad{background:var(--badbg)}
.fres .pct{font-size:1.9rem;font-weight:900;min-width:76px;text-align:center}
.fres p{margin:4px 0 0}
.mk{font-size:1.15rem}
.mk .g{color:var(--ok2)}.mk .r{color:var(--bad);text-decoration:underline}
/* ===================== TEMA "TECH" (opcional, escolhido no botão 🎨 do topo) ===================== */
html.tech{--bg:#0a1214;--c:rgba(18,34,38,.72);--t:#e6f4f1;--m:#8fb3ad;--line:rgba(94,234,212,.16);--gray:rgba(255,255,255,.08);--gray2:rgba(255,255,255,.04);
--ok:#5eead4;--ok2:#2dd4bf;--okbg:rgba(45,212,191,.14);--bad:#fb7185;--bad2:#e11d48;--badbg:rgba(251,113,133,.14);--blue:#38bdf8;--blue2:#0284c7;--midbg:rgba(250,204,21,.08);--brand:#5eead4;color-scheme:dark}
html.tech body{font-family:Inter,system-ui,sans-serif;font-weight:600;background:radial-gradient(1100px 600px at 15% -10%,rgba(45,212,191,.13),transparent 60%),radial-gradient(900px 500px at 100% 15%,rgba(56,189,248,.08),transparent 60%),#0a1214;background-attachment:fixed}
html.tech header{background:rgba(8,16,18,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(94,234,212,.15)}
html.tech .brand img{border-color:rgba(94,234,212,.5);box-shadow:0 0 14px rgba(94,234,212,.35)}
html.tech .card{border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
html.tech .hero .banner{filter:brightness(.82) saturate(.9)}
html.tech .btn{background:#5eead4;color:#062a26;box-shadow:none;border-radius:999px;text-transform:none;letter-spacing:.2px;transition:transform .1s,box-shadow .2s}
html.tech .btn:hover{box-shadow:0 0 18px rgba(94,234,212,.45)}
html.tech .btn:active{transform:scale(.97);box-shadow:none}
html.tech .btn.blue{background:#38bdf8;color:#04202e}
html.tech .btn.ghost{background:transparent;color:var(--t);border:1px solid var(--line)}
html.tech .btn.red,html.tech .btn.mic{background:#fb7185;color:#2a0610}
html.tech .tab{background:var(--c);border:1px solid var(--line);box-shadow:none;color:var(--m)}
html.tech .tab.on{border-color:#5eead4;color:#5eead4;background:rgba(94,234,212,.08);box-shadow:0 0 0 1px rgba(94,234,212,.25),0 0 22px rgba(94,234,212,.12)}
html.tech .unit{background:rgba(18,34,38,.6)!important;border:1px solid var(--line);box-shadow:none;color:var(--t)}
html.tech .unit b{color:#5eead4;letter-spacing:2.5px;font-size:.7rem}
html.tech .node .dot{background:radial-gradient(circle at 30% 30%,rgba(94,234,212,.35),rgba(14,28,32,.95));border:2px solid #5eead4;box-shadow:0 0 18px rgba(94,234,212,.35)}
html.tech .node:active .dot{box-shadow:0 0 8px rgba(94,234,212,.35)}
html.tech .node.new .dot{background:rgba(255,255,255,.04);border-color:var(--line);box-shadow:none}
html.tech .node.next .dot{outline-color:rgba(94,234,212,.5)}
html.tech .bubble{background:#5eead4;color:#062a26;border-color:#5eead4}
html.tech .bubble:after{border-top-color:#5eead4}
html.tech .prog{background:rgba(255,255,255,.07)}
html.tech .prog i{background:linear-gradient(90deg,#2dd4bf,#38bdf8)!important;box-shadow:0 0 10px rgba(45,212,191,.5)}
html.tech .pic{background:rgba(94,234,212,.06)!important;border:1px solid var(--line)}
html.tech .o,html.tech .tile,html.tech .lcard{background:var(--c);border:1px solid var(--line)}
html.tech .o:hover,html.tech .tile:hover,html.tech .lcard:hover{border-color:rgba(94,234,212,.5);background:rgba(94,234,212,.06)}
html.tech .o.ok{border-color:#5eead4;color:#5eead4;background:var(--okbg)}
html.tech .o.bad{border-color:#fb7185;color:#fb7185;background:var(--badbg)}
html.tech .snd{background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.4);box-shadow:none}
html.tech .snd svg{fill:#7dd3fc}
html.tech .fb.ok{background:rgba(6,40,36,.94);color:#5eead4;border-top:1px solid rgba(94,234,212,.35);backdrop-filter:blur(10px)}
html.tech .fb.bad{background:rgba(44,8,18,.94);color:#fb7185;border-top:1px solid rgba(251,113,133,.35);backdrop-filter:blur(10px)}
html.tech .idle{background:rgba(8,28,38,.95);color:#bae6fd;box-shadow:0 -1px 0 rgba(56,189,248,.3)}
html.tech .rrow{background:var(--c);border:1px solid var(--line)}
html.tech .rrow.me{border-color:#5eead4;background:rgba(94,234,212,.08);box-shadow:0 0 22px rgba(94,234,212,.15)}
html.tech .hsk,html.tech .lcard.guide{border-color:var(--line)}
html.tech .badge{background:rgba(250,204,21,.14);color:#fde68a}
html.tech .formal,html.tech .inp,html.tech .code,html.tech .ex2,html.tech .tiers>span{background:rgba(255,255,255,.04)}
html.tech .modal .card{background:#0f1d20}
html.tech .hl em{color:#ff8a9a}
html.tech .q,html.tech .tier b,html.tech .gd h2{letter-spacing:.2px}
html.tech .pitch polyline{stroke:#5eead4}html.tech .pitch circle{fill:#5eead4}
html.tech .dl{border-color:rgba(94,234,212,.4);background:rgba(94,234,212,.08);color:#a7f3e4}
footer{text-align:center;color:var(--m);font-size:.85rem;margin-top:40px}

let V=[];const lv=()=>{V=speechSynthesis.getVoices()};

function say(text,lang){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);u.lang=lang;
const n=s=>s.lang.replace('_','-').toLowerCase();
const v=V.find(s=>n(s)==lang.toLowerCase())||V.find(s=>n(s).startsWith(lang.slice(0,2)));
if(v)u.voice=v;u.rate=lang.startsWith('zh')?.75:.95;speechSynthesis.speak(u)}
const ptTxt=t=>t.replace(/\(.*?\)/g,'').replace('/',',').trim();
const sayZh=w=>say(w.h,'zh-CN'),sayPt=w=>say(ptTxt(w.t),'pt-BR');
const SPK='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

// ---------- Progresso ----------
let S={best:{},inter:false,streak:0,last:''};try{S=Object.assign(S,JSON.parse(localStorage.getItem('yh')))}catch(e){}
const save=()=>{try{localStorage.setItem('yh',JSON.stringify(S))}catch(e){}};
// Tema visual: "Clássico" (padrão) ou "Tech" (escuro e futurista). A escolha fica salva no aparelho.
function applyTheme(){const t=S.theme=='tech';document.documentElement.classList.toggle('tech',t);
document.getElementById('th').textContent=t?'🎨 Clássico':'🎨 Tech';
document.querySelector('meta[name=theme-color]').content=t?'#0a1214':'#0b8a3e';
if(t&&!document.getElementById('fInter'))document.head.insertAdjacentHTML('beforeend','<link id="fInter" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap">')}
function toggleTheme(){S.theme=S.theme=='tech'?'':'tech';save();applyTheme()}
applyTheme();
// Identificação do aluno no ranking: id público + chave secreta (só este aparelho pode atualizar a linha dele)
const rid=()=>Math.random().toString(36).slice(2,10);
if(!S.id){S.id=rid()+rid();S.key=rid()+rid()+rid();save()}
// Código de acesso (6 letras/números, sem os que confundem como O/0 e I/1): nome + código recuperam a conta
if(!S.code){S.code=[...Array(6)].map(()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');save()}
const xpT=()=>Object.values(S.best).reduce((a,b)=>a+b,0);
const lvl=()=>Math.floor(xpT()/10);
// Medalhas: o máximo de XP é 10 por aula — provas do Iniciante e do Intermediário + treino de fala das
// palavras e das frases. Diamante = tudo com 10/10.
const TIERS=[['Bronze','铜牌','🥉',0,'#cd7f32','medal-bronze.png'],['Prata','银牌','🥈',1/3,'#9aa8b5','medal-prata.png'],['Ouro','金牌','🥇',2/3,'#ffc800','medal-ouro.png'],['Diamante','钻石','💎',1,'#1cb0f6','medal-diamante.png']];
// Se a imagem da medalha não carregar (ex.: arquivo ainda não enviado), mostra o emoji no lugar
const medal=i=>`<img class="mdl" src="${TIERS[i][5]}" alt="${TIERS[i][0]}" draggable="false" onerror="this.outerHTML='<span class=mdl-e>${TIERS[i][2]}</span>'">`;
const XPM=()=>(D.length+DI.length)*10*2;
const tierXP=i=>Math.ceil(XPM()*TIERS[i][3]);
const tierFor=x=>{let t=0;TIERS.forEach((_,i)=>{if(x>=tierXP(i))t=i});return t};
const tier=()=>tierFor(xpT());
const tierUp=t0=>tier()>t0?`<br>${medal(tier())} Nova medalha · 新奖牌: <b>${TIERS[tier()][0]} · ${TIERS[tier()][1]}</b>!`:'';
function tierCard(){const t=tier(),x=xpT(),T=TIERS[t],nx=TIERS[t+1];
const pct=nx?(x-tierXP(t))/(tierXP(t+1)-tierXP(t))*100:100;
return`<div class="card tier">${medal(t)}<div class="tx"><b>Medalha ${T[0]} · ${T[1]}</b> <small>${x} / ${XPM()} XP</small>
<div class="prog"><i style="width:${pct}%;background:${nx?nx[4]:T[4]}"></i></div>
<small>${nx?`Faltam <b>${tierXP(t+1)-x} XP</b> para ${nx[0]} ${medal(t+1)} · 还差${tierXP(t+1)-x}经验升到${nx[1]}`:'Você completou tudo com 100%, provas e fala! · 所有课程和口语练习全部满分！'}</small>
<div class="tiers">${TIERS.map((y,i)=>`<span class="${i<=t?'got':''}" title="${i==3?'Todas as provas e falas com 10/10':tierXP(i)+' XP'}">${medal(i)}${y[0]}</span>`).join('')}</div></div></div>`}
const day=o=>{const d=new Date();d.setDate(d.getDate()-(o||0));return d.toDateString()};
const streak=()=>S.last==day()||S.last==day(1)?S.streak:0;
const bump=()=>{if(S.last!=day()){S.streak=S.last==day(1)?S.streak+1:1;S.last=day()}};
const starsOf=s=>s==null?0:s>=10?3:s>=8?2:s>=6?1:0;
const done=i=>starsOf(S.best[i])>0;
const nextL=()=>{const i=D.findIndex((_,j)=>!done(j));return i<0?0:i};
const app=document.getElementById('app');
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function hud(){document.getElementById('stats').innerHTML=`<span title="Dias seguidos">🔥 ${streak()}</span><span title="XP total">⭐ ${xpT()}</span><span class="medal" title="${TIERS[tier()][0]} · Level ${lvl()}">${medal(tier())}${TIERS[tier()][0]} <small>Lv ${lvl()}</small></span>`}

const ZZ=[0,70,100,70,0,-70,-100,-70];
// Trilha de aulas (usada pelas duas classes). list = [[nome, desenho]], key = chave do progresso
function pathH(units,list,key,n,fn,first,locked){let h='';
units.forEach((u,ui)=>{h+=`<div class="unit" style="background:${u[1]}"><b>Unidade ${ui+1} · 第${ui+1}单元</b><span>${u[0]}</span></div><div class="path">`;
for(let i=ui*5;i<ui*5+5&&i<list.length;i++){const b=S.best[key(i)],st=starsOf(b),nx=!locked&&i==n,cls=b==null&&!nx?'new':'';
h+=`<div class="node ${cls} ${nx?'next':''}" style="--o:${ZZ[i%8]};--uc:${u[1]};--ud:${u[2]}" ${locked?'':`onclick="${fn}(${i})"`}>${nx?`<div class="bubble">${first?'Começar · 开始':'Próxima · 下一课'}</div>`:''}
<div class="dot">${img(list[i][1])}</div><div class="lb">Aula ${i+1} · ${list[i][0]}<small>${locked?'🔒 Bloqueada · 未解锁':b!=null?`<span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span> ${b}/10`:'Não feita · 未完成'}</small></div></div>`}
h+=`</div>`});return h}

const IDLE_S=15;let idleT=null;

// ---- Repetição espaçada: acertou → volta em 1, 2, 4, 7, 15, 30 dias; errou → volta hoje ----

// Prioridade: mais atrasados e mais errados primeiro; se faltar, completa com os menos dominados
function revPick(n){const t=dayN(),s=S.srs||{},pool=revPool();
const pr=it=>{const c=s[ikey(it)];return c?(t-c[1])*2-c[0]+5:3};
let r=sh(pool.filter(isDue)).sort((a,b)=>pr(b)-pr(a)).slice(0,n);
if(r.length<n)r=r.concat(sh(pool.filter(it=>!r.includes(it))).sort((a,b)=>((s[ikey(a)]||[0])[0])-((s[ikey(b)]||[0])[0])).slice(0,n-r.length));
return sh(r)}
// Pares para o "Ligue os pares": sem chinês nem português repetidos
const uniqPairs=(arr,n)=>{const r=[],H=new Set(),T=new Set();for(const x of arr){if(r.length>=n)break;if(H.has(x.h)||T.has(x.t))continue;H.add(x.h);T.add(x.t);r.push(x)}return r};

// ---- Tons: gera pinyins com um tom trocado (para "Qual é a pronúncia certa?") ----
const TONES={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'},TREV={};
for(const b in TONES)[...TONES[b]].forEach((c,t)=>TREV[c]=[b,t]);
function toneVars(py){const ch=[...py],pos=ch.map((c,i)=>TREV[c]?i:-1).filter(i=>i>=0),out=new Set();
pos.forEach(i=>{const[b,t]=TREV[ch[i]];for(let n=0;n<4;n++)if(n!=t){const c2=[...ch];c2[i]=TONES[b][n];out.add(c2.join(''))}});
return sh([...out]).slice(0,3)}
const toneOK=it=>isW(it)&&[...it.h].length<=3&&[...it.p].some(c=>TREV[c])&&toneVars(it.p).length>=3;
// ---- Acentos do português: gera grafias com o acento trocado (para "Qual é a escrita certa?") ----
const ACC={'á':'aâã','à':'aá','â':'aáã','ã':'aáâ','é':'eê','ê':'eé','í':'iì','ó':'oôõ','ô':'oóõ','õ':'oóô','ú':'uù','ç':'c'};
function accVars(wd){const ch=[...wd],out=new Set();
ch.forEach((c,i)=>{const lo=c.toLowerCase(),alt=ACC[lo];if(!alt)return;[...alt].forEach(a=>{const c2=[...ch];c2[i]=c==lo?a:a.toUpperCase();out.add(c2.join(''))})});
out.add(ch.map(c=>{const lo=c.toLowerCase();return ACC[lo]?(c==lo?ACC[lo][0]:ACC[lo][0].toUpperCase()):c}).join(''));out.delete(wd);return sh([...out]).slice(0,3)}

// ---- Comparação ----
const ZD='零一二三四五六七八九';
const zhNum=n=>n<10?ZD[n]:n<20?'十'+(n%10?ZD[n%10]:''):n<100?ZD[Math.floor(n/10)]+'十'+(n%10?ZD[n%10]:''):n==100?'一百':String(n);
const normZh=s=>s.replace(/\d+/g,d=>zhNum(+d)).replace(/[她它]/g,'他').replace(/[地得]/g,'的').replace(/两/g,'二').replace(/[^一-鿿]/g,'');
const PU=['zero','um','dois','tres','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],PT=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const ptNum=n=>n<20?PU[n]:n<100?PT[Math.floor(n/10)]+(n%10?' e '+PU[n%10]:''):n==100?'cem':String(n);
const normW=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'').replace(/^catorze$/,'quatorze');
const normPt=s=>s.replace(/\d+/g,d=>' '+ptNum(+d)+' ').split(/[\s\-]+/).map(normW).filter(Boolean);
// Maior subsequência comum: diz quais partes do texto certo apareceram no que foi ouvido
function lcs(a,b){const n=a.length,m=b.length,T=Array.from({length:n+1},()=>new Array(m+1).fill(0));
for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=a[i]==b[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
const hit=new Set();let i=0,j=0;while(i<n&&j<m){if(a[i]==b[j]){hit.add(i);i++;j++}else if(T[i+1][j]>=T[i][j+1])i++;else j++}
return{len:T[0][0],hit}}
function cmp(target,heard){if(F.lang=='zh'){const a=[...normZh(target)],b=[...normZh(heard)],r=lcs(a,b);
return{pct:a.length?Math.round(200*r.len/(a.length+b.length)):0,marks:a.map((c,i)=>`<span class="${r.hit.has(i)?'g':'r'}">${c}</span>`).join('')}}
const words=target.split(/\s+/).map(w=>[w,normW(w)]).filter(x=>x[1]),a=words.map(x=>x[1]),b=normPt(heard),r=lcs(a,b);
return{pct:a.length?Math.round(200*r.len/(a.length+b.length)):0,marks:words.map((x,i)=>`<span class="${r.hit.has(i)?'g':'r'}">${esc(x[0])}</span>`).join(' ')}}
function judge(alts){const w=fitems()[fi];let best={pct:-1};
alts.forEach(h=>ftargets(w).forEach(t=>{const r=cmp(t,h);if(r.pct>best.pct)best=Object.assign(r,{heard:h})}));
fsc[fi]=Math.max(fsc[fi]||0,best.pct);
const v=best.pct>=F_OK?['ok',best.pct>=95?'Perfeito! ✓ 太棒了！':'Correto! ✓ 正确！']:best.pct>=60?['mid','Quase lá! 差不多了！']:['bad','Tente de novo · 再试一次'];
document.getElementById('res').innerHTML=`<div class="fres ${v[0]}"><div class="pct">${best.pct}%</div><div><b>${v[1]}</b><p>Ouvi · 听到: “${esc(best.heard)}”</p><p class="mk">${best.marks}</p></div></div>`}
function fend(){scrollTo(0,0);const it=fitems(),avg=Math.round(it.reduce((s,_,i)=>s+(fsc[i]||0),0)/it.length),k=fkey(F.li);
// XP: 1 por fala correta. Vale a melhor tentativa da aula, em qualquer uma das duas línguas.
const ok=it.filter((_,i)=>(fsc[i]||0)>=F_OK).length,xk=sxk(F.src,F.li),g=Math.max(0,ok-(S.best[xk]||0)),l0=lvl(),t0=tier();
S.best[xk]=Math.max(ok,S.best[xk]||0);
S.fala=S.fala||{};S.fala[k]=Math.max(avg,S.fala[k]||0);bump();save();rankPush();const st=fstars(avg),n=F.src=='b'?D.length:DI.length;
app.innerHTML=`<div class="card end"><img src="${tw(avg>=60?'🏆':'💪')}" alt="" style="width:110px"><div class="big">${ok}/${it.length}</div>
<div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><p>Falas corretas · 正确次数 — média de pronúncia ${avg}%<br>
+${g} XP${g<ok?' (só melhora sobre sua melhor nota conta · 只计算超过最好成绩的部分)':''}${lvl()>l0?`<br>⬆️ Subiu para o level ${lvl()}! · 升到${lvl()}级！`:''}${tierUp(t0)}<br>
<small>Itens que você pulou contam como 0%. · 跳过的题目按0分计算。</small></p>
<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn ghost" onclick="fstart(${F.li})">Repetir · 再练一次</button>
${F.li<n-1?`<button class="btn" onclick="fstart(${F.li+1})">Próxima aula → · 下一课</button>`:''}<button class="btn blue" onclick="home()">Início · 首页</button></div></div>`;hud()}

function mergeProg(p){try{p=JSON.parse(p)}catch(e){return}if(!p)return;

S.fala=S.fala||{};for(const k in p.fala||{})S.fala[k]=Math.max(S.fala[k]||0,+p.fala[k]||0);
S.inter=S.inter||!!p.inter;S.iintro=S.iintro||!!p.iintro;if(p.learn&&!S.learn)S.learn=p.learn;if((p.streak||0)>(S.streak||0)){S.streak=p.streak;S.last=p.last}
// Revisão: fica com o registro mais avançado de cada item
S.srs=S.srs||{};for(const k in p.srs||{}){const a=S.srs[k],b=p.srs[k];if(Array.isArray(b)&&(!a||b[1]>a[1]))S.srs[k]=b}}

if(v.length<2)return err('Digite pelo menos 2 letras. · 请至少输入两个字。');
const old=S.name;S.name=v;nb.disabled=true;nb.textContent='Verificando... · 检查中…';
// A planilha confere se o nome está livre. Sem internet, o nome é aceito e conferido no próximo envio.
rankPush().then(d=>{if(d&&d.erro=='nome'){S.name=old;S.taken=old&&S.taken==old?old:null;save();nb.disabled=false;nb.textContent=edit?'Salvar · 保存':'Começar · 开始';
return err(`O nome “${esc(v)}” já está em uso. Escolha outro, por exemplo “${esc(v)} S.”.<br>“${esc(v)}”已经有人用了，请换一个名字。`)}
save();RK=null;home();if(!old&&RANK_URL)showCode()})}}

function rhome(){let h=tabs()+`<div class="card hero"><div class="txt"><h2>🏆 Ranking · 排行榜</h2>
<p>Quem avançou mais? A pontuação é o XP total: provas do Iniciante e do Intermediário + treino de fala.</p>
<p lang="zh-CN" class="zh">谁进步最多？分数是总经验值：初级班和中级班的测验 + 口语练习。</p>
<p>Você aparece como <b>${esc(S.name)}</b> · <button class="lnk" onclick="askName(true)">Trocar nome · 改名</button></p>
${RANK_URL?`<p class="us" style="text-align:left">🔑 Seu código de acesso · 登录码: <b class="code sm">${S.code}</b><br>Use nome + código para entrar em outro celular ou no app instalado sem perder o progresso. · 用名字和登录码，可在其他设备找回进度。</p>`:''}</div></div><div id="rk">`;
const meRow=(pos,name,xp,b,i,f,me)=>`<div class="rrow ${me?'me':''}"><span class="pos ${pos&&pos<=3?'p'+pos:''}">${pos||'–'}</span>${medal(tierFor(xp))}
<span class="nm">${esc(String(name))}${me?' <em>(você · 你)</em>':''}<small>Iniciante ${b}/${D.length} · Intermediário ${i}/${DI.length} · Fala ${f}/${D.length+DI.length}</small></span><span class="xp">${xp}<small>XP</small></span></div>`;
if(!RANK_URL){h+=`<div class="card hsk">${img('🛠️')}<div><b>O ranking online ainda não foi ativado · 在线排行榜尚未开启</b><p>Por enquanto aparece só o seu resultado.</p></div></div>`+meRow(0,S.name,xpT(),doneB(),doneI(),doneF(),true)}
else if(RKerr)h+=`<div class="card hsk">${img('📡')}<div><b>Não foi possível carregar o ranking · 无法加载排行榜</b><p>Verifique sua internet e tente de novo.</p><button class="btn blue" onclick="RKerr=false;RK=null;rhome()">Tentar de novo · 重试</button></div></div>`;
else if(RK==null){if(!RKbusy)rankLoad();h+=`<div class="card" style="text-align:center">⏳ Carregando o ranking... · 正在加载排行榜…</div>`}
else{const pos=RK.findIndex(r=>r.id==S.id);
h+=RK.length?RK.map((r,j)=>meRow(j+1,r.name,r.xp,r.b,r.i,r.f||0,r.id==S.id)).join(''):`<div class="card">Ninguém no ranking ainda. Seja o primeiro! · 还没有人上榜，快来当第一名！</div>`;
if(pos<0)h+=`<p class="us">Seu resultado ainda não está na lista (pode levar alguns segundos):</p>`+meRow(0,S.name,xpT(),doneB(),doneI(),doneF(),true);
h+=`<div class="row" style="justify-content:center"><button class="btn ghost" onclick="RK=null;rhome()">🔄 Atualizar · 刷新</button></div>`}
app.innerHTML=h+`</div><footer>Youhua Educacional · 幼华双语学校 · desde 1992</footer>`}
// ======================= INSTALAR COMO APP =======================
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1);
// Botão "Baixar app" no topo. Android/computador: o navegador só oferece a instalação se o app
// ainda não estiver instalado. iPhone: não dá para saber, então o aluno toca em "Já instalei".
let instEvt=null;
function dlBtn(){const b=document.getElementById('dl');b.hidden=isApp()||!(instEvt||(isIOS&&!S.noInstall))}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;dlBtn()});
addEventListener('appinstalled',()=>{instEvt=null;dlBtn()});
// Passo a passo conforme o navegador do iPhone. Desde o iOS 16.4, Chrome, Edge e Firefox também adicionam à Tela de Início.
function iosSteps(){const ua=navigator.userAgent,m=ua.match(/OS (\d+)_(\d+)/),v=m?+m[1]+(+m[2])/100:99,old=v<16.04;
const br=/CriOS/.test(ua)?'Chrome':/EdgiOS/.test(ua)?'Edge':/FxiOS/.test(ua)?'Firefox':/Safari/.test(ua)&&!/(GSA|Instagram|FBAN|FBAV|Line|MicroMessenger)/.test(ua)?'Safari':'outro';
if(br=='Safari')return`<p>1. Toque em <b>Compartilhar</b> (o quadrado com a seta ⬆️, na barra de baixo).<br>2. Role e toque em <b>“Adicionar à Tela de Início”</b>.<br>3. Toque em <b>Adicionar</b>.</p>
<p lang="zh-CN" class="zh">1. 点底部的 <b>“分享”</b>（带箭头的方框 ⬆️）。<br>2. 往下滑，点 <b>“添加到主屏幕”</b>。<br>3. 点 <b>“添加”</b>。</p>`;
if((br=='Chrome'||br=='Edge')&&!old)return`<p>1. No ${br}, toque em <b>Compartilhar</b> (o quadrado com a seta ⬆️, <b>na barra de endereço, em cima à direita</b>).<br>2. Toque em <b>“Adicionar à Tela de Início”</b>.<br>3. Toque em <b>Adicionar</b>.</p>
<p lang="zh-CN" class="zh">1. 在 ${br} 里，点<b>地址栏右上角</b>的 <b>“分享”</b>（带箭头的方框 ⬆️）。<br>2. 点 <b>“添加到主屏幕”</b>。<br>3. 点 <b>“添加”</b>。</p>`;
if(br=='Firefox'&&!old)return`<p>1. No Firefox, toque no menu <b>☰</b> (embaixo à direita) e depois em <b>Compartilhar</b>.<br>2. Toque em <b>“Adicionar à Tela de Início”</b>.<br>3. Toque em <b>Adicionar</b>.</p>
<p lang="zh-CN" class="zh">1. 在 Firefox 里，点右下角的菜单 <b>☰</b>，再点 <b>“分享”</b>。<br>2. 点 <b>“添加到主屏幕”</b>。<br>3. 点 <b>“添加”</b>。</p>`;
// iOS antigo (antes do 16.4) ou navegador dentro de outro app (Instagram, WeChat...): só pelo Safari
return`<p>Neste navegador não dá para adicionar. Copie o link, abra no <b>Safari</b>, toque em <b>Compartilhar</b> ⬆️ e depois em <b>“Adicionar à Tela de Início”</b>.</p>
<p lang="zh-CN" class="zh">这个浏览器无法添加。请复制链接，用 <b>Safari</b> 打开，点 <b>“分享”</b> ⬆️，再点 <b>“添加到主屏幕”</b>。</p>`}
function installNow(){if(instEvt){instEvt.prompt();instEvt.userChoice.then(()=>{instEvt=null;dlBtn()});return}
document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="mdl" onclick="if(event.target==this)this.remove()"><div class="card">
<img src="apple-touch-icon.png" alt="" style="width:64px;height:64px;border-radius:14px"><h3>Instalar no iPhone · 安装到 iPhone</h3>
${iosSteps()}
<p class="us">No iPhone não existe instalação com um clique: a Apple só permite pelo menu Compartilhar. · iPhone 不支持一键安装，只能通过“分享”菜单添加。</p>
<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn ghost" onclick="S.noInstall=true;save();dlBtn();mdl.remove()">Já instalei · 已安装</button><button class="btn" onclick="mdl.remove()">Entendi · 明白了</button></div></div></div>`)}
dlBtn();
if('serviceWorker'in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

// Ao abrir o site, envia o progresso; se o nome estiver repetido, pede um nome novo
// Alunos que já tinham conta antes do código: mostra o código uma vez, depois que a planilha confirmou o salvamento
rankPush().then(d=>{if(d&&d.erro=='nome'&&!document.getElementById('nm'))home();
else if(d&&d.ok&&!S.codeShown&&!document.getElementById('nm')&&!document.getElementById('mdl'))showCode()});
home();
</script></body></html>
